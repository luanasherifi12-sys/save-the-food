<!doctype html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#063B2A" />
    <meta name="description" content="Save the Food – lidh bizneset me tepricë ushqimi me organizatat dhe vullnetarët në Prishtinë." />
    <title>Save the Food</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link preview on LinkedIn, Facebook, WhatsApp... (Open Graph).
         Social sites need FULL URLs, so the domain is written out here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Save the Food" />
    <meta property="og:locale" content="sq_AL" />
    <meta property="og:url" content="https://save-the-food-tau.vercel.app/" />
    <meta property="og:title" content="Save the Food" />
    <meta
      property="og:description"
      content="Ushqimi që mund të ndihmojë dikë nuk duhet të bëhet mbeturinë. Lidh furrat, restorantet dhe marketet me organizatat humanitare dhe vullnetarët në Prishtinë."
    />
    <meta property="og:image" content="https://save-the-food-tau.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Save the Food: Ushqimi që mund të ndihmojë dikë nuk duhet të bëhet mbeturinë. Telefon me hartën e ushqimit në Prishtinë."
    />

    <!-- Link preview on Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Save the Food" />
    <meta
      name="twitter:description"
      content="Ushqimi që mund të ndihmojë dikë nuk duhet të bëhet mbeturinë. Platformë civic-tech në Prishtinë."
    />
    <meta name="twitter:image" content="https://save-the-food-tau.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Save the Food: Ushqimi që mund të ndihmojë dikë nuk duhet të bëhet mbeturinë. Telefon me hartën e ushqimit në Prishtinë."
    />

    <!-- Fonts from the presentation: Inter (text) and Space Grotesk (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
